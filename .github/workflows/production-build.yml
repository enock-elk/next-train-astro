# PRODUCTION build for nexttrain.co.za — manual trigger only.
#
# This workflow deliberately builds and verifies but does NOT deploy. The live
# domain currently points at the metrorail-app SPA, and the cutover should be a
# conscious act, not a side effect of pushing to a branch. It produces a
# downloadable `dist` artifact you can inspect or hand to a host.
#
# Why the env vars are explicit: astro.config.mjs treats GITHUB_ACTIONS=true as
# "GitHub project Pages" and defaults to base=/next-train-astro/ on the
# github.io origin. A production build must override both, or every asset URL and
# canonical comes out pointing at the preview site.
#
# When you pick a host, add one of the deploy paths at the bottom.
name: Production build (nexttrain.co.za)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://nexttrain.co.za
          PUBLIC_BASE_PATH: /

      - name: Verify URL parity with the live SPA
        run: npm run verify:urls

      - name: Summarise the built URL surface
        run: |
          {
            echo '### Built pages'
            echo
            echo '| URL | Canonical |'
            echo '| --- | --- |'
            for f in dist/*.html; do
              name=$(basename "$f")
              canonical=$(grep -o '<link rel="canonical" href="[^"]*"' "$f" | head -1 | sed 's/.*href="//;s/"//')
              echo "| /$name | ${canonical:-none} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: nexttrain-production-dist
          path: dist
          retention-days: 14

      # ── Deploy: pick ONE once the host is decided ────────────────────────────
      #
      # Option A — GitHub Pages on this repo. Requires moving the nexttrain.co.za
      # CNAME off metrorail-app, and this repo's Pages environment is currently
      # owned by the preview workflow, so retire deploy.yml first.
      #
      #   - name: Add CNAME
      #     run: echo 'nexttrain.co.za' > dist/CNAME
      #   - uses: actions/upload-pages-artifact@v3
      #     with: { path: dist }
      #
      # Option B — Cloudflare Pages. Honours public/_redirects, and lets the
      # preview deploy keep GitHub Pages. Needs CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID repository secrets.
      #
      #   - name: Deploy to Cloudflare Pages
      #     uses: cloudflare/wrangler-action@v3
      #     with:
      #       apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #       accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #       command: pages deploy dist --project-name=nexttrain
