# PRODUCTION build for nexttrain.co.za — manual trigger only.
#
# Builds + verifies + uploads a dist artifact. Does NOT publish to the live host.
# For the zero-downtime cutover (push dist → metrorail-app), use:
#   .github/workflows/deploy-production.yml
#
# Why the env vars are explicit: astro.config.mjs treats GITHUB_ACTIONS=true as
# "GitHub project Pages" and defaults to base=/next-train-astro/ on the
# github.io origin. A production build must override both, or every asset URL and
# canonical comes out pointing at the preview site.
name: Production build (nexttrain.co.za)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://nexttrain.co.za
          PUBLIC_BASE_PATH: /
          PUBLIC_CARTO_API_KEY: ${{ secrets.PUBLIC_CARTO_API_KEY }}

      - name: Verify URL parity with the live SPA
        run: npm run verify:urls

      - name: Verify GitHub schedule fallback
        run: npm run verify:schedule

      - name: Summarise the built URL surface
        run: |
          {
            echo '### Built pages'
            echo
            echo '| URL | Canonical |'
            echo '| --- | --- |'
            for f in dist/*.html; do
              name=$(basename "$f")
              canonical=$(grep -o '<link rel="canonical" href="[^"]*"' "$f" | head -1 | sed 's/.*href="//;s/"//')
              echo "| /$name | ${canonical:-none} |"
            done
            echo
            echo 'To publish live: run workflow **Deploy production → metrorail-app** with confirm=`DEPLOY`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: nexttrain-production-dist
          path: dist
          # Required so /.well-known/assetlinks.json survives the artifact hop.
          include-hidden-files: true
          retention-days: 14
