# Publisher for notices_scheduled.
# GitHub only starts this file every few hours, not every 5 minutes.
# Each start keeps calling runScheduledAlerts once a minute for 5.5 hours
# so a due post is not left waiting for the next Actions slot.
# A push of this file starts a loop immediately. OIDC is enough.
name: Publish due scheduled alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-alerts.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-alerts-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Call community worker cron
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
          TTL_WIPE_SECRET: ${{ secrets.TTL_WIPE_SECRET }}
        run: |
          set -u
          URL="https://nexttrain-community.enock.workers.dev/cron/scheduled-alerts"
          SECRET="${ALERT_CRON_SECRET:-${TTL_WIPE_SECRET:-}}"
          deadline=$((SECONDS + 330 * 60))
          failures=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            ok=0
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexttrain-community" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || OIDC=""
              if [ -n "$OIDC" ] && curl -fsS -X POST \
                -H "Authorization: Bearer ${OIDC}" \
                -H "Content-Type: application/json" \
                --data '{}' \
                "$URL"; then
                ok=1
              else
                echo "::warning::OIDC cron call failed. Trying shared secret."
              fi
            fi
            if [ "$ok" -ne 1 ] && [ -n "$SECRET" ]; then
              if curl -fsS -X POST \
                -H "X-Cron-Secret: ${SECRET}" \
                -H "Content-Type: application/json" \
                --data '{}' \
                "$URL"; then
                ok=1
              fi
            fi
            if [ "$ok" -ne 1 ]; then
              failures=$((failures + 1))
              echo "::warning::Scheduled alerts tick failed (${failures})."
              if [ "$failures" -ge 5 ] && [ "$ok" -ne 1 ] && [ -z "$SECRET" ] && [ -z "${OIDC:-}" ]; then
                echo "::error::Scheduled alerts did not publish. OIDC failed and ALERT_CRON_SECRET is not set."
                exit 1
              fi
            else
              failures=0
            fi
            sleep 60
          done
