# Publisher for notices_scheduled.
# GitHub only starts this file every few hours, not every 5 minutes.
# Each start keeps calling runScheduledAlerts once a minute for 5.5 hours
# so a due post is not left waiting for the next Actions slot.
# A push of this file starts a loop immediately. OIDC is enough.
name: Publish due scheduled alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scheduled-alerts.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-alerts-publish-v4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Publish due alerts once
        id: once
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
          TTL_WIPE_SECRET: ${{ secrets.TTL_WIPE_SECRET }}
        run: |
          set -u
          URL="https://nexttrain-community.enock.workers.dev/cron/scheduled-alerts"
          SECRET="${ALERT_CRON_SECRET:-${TTL_WIPE_SECRET:-}}"
          post() {
            curl -fsS --max-time 30 -X POST \
              -H "$1" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$URL"
          }
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            OIDC="$(curl -fsS --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexttrain-community" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || OIDC=""
            if [ -n "$OIDC" ]; then
              BODY="$(post "Authorization: Bearer ${OIDC}")" && {
                echo "$BODY"
                echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
                export BODY
                python3 -c 'import os; s=os.environ.get("BODY","")[:400].replace("%","%25").replace("\r","%0D").replace("\n","%0A"); print("::notice::"+s)'
                exit 0
              }
            fi
            echo "::warning::OIDC cron call failed. Trying shared secret."
          fi
          if [ -n "$SECRET" ]; then
            BODY="$(post "X-Cron-Secret: ${SECRET}")" && {
              echo "$BODY"
              echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
          fi
          echo "::error::Scheduled alerts did not publish. OIDC failed and ALERT_CRON_SECRET is not set."
          exit 1
      - name: Keep publishing due alerts
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
          TTL_WIPE_SECRET: ${{ secrets.TTL_WIPE_SECRET }}
        run: |
          set -u
          URL="https://nexttrain-community.enock.workers.dev/cron/scheduled-alerts"
          SECRET="${ALERT_CRON_SECRET:-${TTL_WIPE_SECRET:-}}"
          deadline=$((SECONDS + 330 * 60))
          failures=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            sleep 60
            ok=0
            OIDC=""
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              OIDC="$(curl -fsS --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexttrain-community" \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || OIDC=""
              if [ -n "$OIDC" ] && curl -fsS --max-time 30 -X POST \
                -H "Authorization: Bearer ${OIDC}" \
                -H "Content-Type: application/json" \
                --data '{}' \
                "$URL"; then
                ok=1
              else
                echo "::warning::OIDC cron call failed. Trying shared secret."
              fi
            fi
            if [ "$ok" -ne 1 ] && [ -n "$SECRET" ]; then
              if curl -fsS --max-time 30 -X POST \
                -H "X-Cron-Secret: ${SECRET}" \
                -H "Content-Type: application/json" \
                --data '{}' \
                "$URL"; then
                ok=1
              fi
            fi
            if [ "$ok" -ne 1 ]; then
              failures=$((failures + 1))
              echo "::warning::Scheduled alerts tick failed (${failures})."
            else
              failures=0
            fi
          done
