# Backup publisher for notices_scheduled.
# Cloudflare Worker cron (*/5) is the primary path. This hits the same
# runScheduledAlerts handler so due jobs still post when the Worker cron
# was not redeployed or silently failed.
# GitHub Actions OIDC is enough — do not depend on ALERT_CRON_SECRET.
name: Publish due scheduled alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-alerts-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call community worker cron
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
          TTL_WIPE_SECRET: ${{ secrets.TTL_WIPE_SECRET }}
        run: |
          set -euo pipefail
          URL="https://nexttrain-community.enock.workers.dev/cron/scheduled-alerts"
          SECRET="${ALERT_CRON_SECRET:-${TTL_WIPE_SECRET:-}}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexttrain-community" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
            if curl -fsS -X POST \
              -H "Authorization: Bearer ${OIDC}" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$URL"; then
              exit 0
            fi
            echo "::warning::OIDC cron call failed. Trying shared secret."
          fi
          if [ -n "$SECRET" ]; then
            curl -fsS -X POST \
              -H "X-Cron-Secret: ${SECRET}" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$URL"
            exit 0
          fi
          echo "::error::Scheduled alerts did not publish. OIDC failed and ALERT_CRON_SECRET is not set."
          exit 1
