# Backup publisher for notices_scheduled.
# Cloudflare Worker cron (*/5) is the primary path. This hits the same
# runScheduledAlerts handler so due jobs still post when the Worker cron
# was not redeployed or silently failed.
name: Publish due scheduled alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-alerts-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Call community worker cron
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
          TTL_WIPE_SECRET: ${{ secrets.TTL_WIPE_SECRET }}
        run: |
          set -euo pipefail
          SECRET="${ALERT_CRON_SECRET:-${TTL_WIPE_SECRET:-}}"
          if [ -z "$SECRET" ]; then
            echo "::warning::ALERT_CRON_SECRET / TTL_WIPE_SECRET not set. Cloudflare Worker cron must publish on its own."
            exit 0
          fi
          curl -fsS -X POST \
            -H "X-Cron-Secret: ${SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "https://nexttrain-community.enock.workers.dev/cron/scheduled-alerts"
