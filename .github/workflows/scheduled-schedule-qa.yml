# Hourly timetable scan. The job reads the public dump, then stores a short
# summary on schedule_qa_status. Dev Hub turns the QA header red when errors > 0.
# ALERT_CRON_SECRET is an optional fallback. Sign-in is the GitHub OIDC token.
# A 400 from the worker is a database write failure, not a missing secret.
# The worker account needs roles/firebasedatabase.admin.
name: Schedule data QA

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-schedule-qa
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan the public timetable
        id: scan
        run: |
          set -u
          SUMMARY="$(node scripts/schedule-qa-cron.mjs)"
          echo "$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$SUMMARY" > "$RUNNER_TEMP/schedule-qa.json"
      - name: Store the summary
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
          TTL_WIPE_SECRET: ${{ secrets.TTL_WIPE_SECRET }}
        run: |
          set -u
          URL="https://nexttrain-community.enock.workers.dev/cron/schedule-qa"
          SECRET="${ALERT_CRON_SECRET:-${TTL_WIPE_SECRET:-}}"
          RESP_CODE=""
          RESP_BODY=""
          post() {
            local header="$1"
            local outfile="$RUNNER_TEMP/schedule-qa-response.json"
            RESP_CODE="$(curl -sS --max-time 30 -o "$outfile" -w '%{http_code}' -X POST \
              -H "$header" \
              -H "Content-Type: application/json" \
              --data-binary @"$RUNNER_TEMP/schedule-qa.json" \
              "$URL")" || RESP_CODE="${RESP_CODE:-000}"
            RESP_BODY="$(cat "$outfile" 2>/dev/null || true)"
            echo "HTTP ${RESP_CODE}"
            printf '%s\n' "$RESP_BODY"
            printf '%s\n' "$RESP_BODY" >> "$GITHUB_STEP_SUMMARY"
            [ "$RESP_CODE" = "200" ]
          }
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            OIDC="$(curl -fsS --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexttrain-community" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || OIDC=""
            if [ -n "$OIDC" ]; then
              if post "Authorization: Bearer ${OIDC}"; then
                exit 0
              fi
              echo "::warning::Worker rejected the schedule QA call with HTTP ${RESP_CODE}. Trying shared secret."
            else
              echo "::warning::OIDC schedule QA call failed. Trying shared secret."
            fi
          fi
          if [ -n "$SECRET" ]; then
            if post "X-Cron-Secret: ${SECRET}"; then
              exit 0
            fi
          fi
          echo "::error::Schedule QA summary was not stored. Last worker HTTP ${RESP_CODE:-none}."
          printf '%s\n' "${RESP_BODY:-}"
          exit 1
