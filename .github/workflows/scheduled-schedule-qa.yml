# Hourly timetable scan. The job reads the public dump, then stores a short
# summary on schedule_qa_status. Dev Hub turns the QA header red when errors > 0.
name: Schedule data QA

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-schedule-qa
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan the public timetable
        id: scan
        run: |
          set -u
          SUMMARY="$(node scripts/schedule-qa-cron.mjs)"
          echo "$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$SUMMARY" > "$RUNNER_TEMP/schedule-qa.json"
      - name: Store the summary
        env:
          ALERT_CRON_SECRET: ${{ secrets.ALERT_CRON_SECRET }}
          TTL_WIPE_SECRET: ${{ secrets.TTL_WIPE_SECRET }}
        run: |
          set -u
          URL="https://nexttrain-community.enock.workers.dev/cron/schedule-qa"
          SECRET="${ALERT_CRON_SECRET:-${TTL_WIPE_SECRET:-}}"
          BODY="$(cat "$RUNNER_TEMP/schedule-qa.json")"
          post() {
            curl -fsS --max-time 30 -X POST \
              -H "$1" \
              -H "Content-Type: application/json" \
              --data "$BODY" \
              "$URL"
          }
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            OIDC="$(curl -fsS --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nexttrain-community" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')" || OIDC=""
            if [ -n "$OIDC" ]; then
              post "Authorization: Bearer ${OIDC}" && exit 0
            fi
            echo "::warning::OIDC schedule QA call failed. Trying shared secret."
          fi
          if [ -n "$SECRET" ]; then
            post "X-Cron-Secret: ${SECRET}" && exit 0
          fi
          echo "::error::Schedule QA summary was not stored. OIDC failed and ALERT_CRON_SECRET is not set."
          exit 1
